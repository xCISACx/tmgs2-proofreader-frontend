<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMGS2 Proofreader</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <img src="/assets/logoEnglish.png" alt="Tokimeki Memorial Girl's Side 2nd Season" class="logo">
      <h1>Proofreader</h1>
      <p class="subtitle">Search for dialogue lines and submit corrections</p>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Type the dialogue line you're looking for..."
          autocomplete="off"
        >
        <button id="search-btn" class="btn primary">Search</button>
      </div>
      <p class="search-hint">Enter at least 3 characters to search across all scenario files</p>
    </section>

    <!-- Results Section -->
    <section id="results-section" class="hidden">
      <h2 id="results-heading">Search Results</h2>
      <div id="results-list"></div>
    </section>

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p id="loading-text">Loading...</p>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
