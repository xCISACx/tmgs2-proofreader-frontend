<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMGS2 Proofreader</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <img src="/assets/logoEnglish.png" alt="Tokimeki Memorial Girl's Side 2nd Season" class="logo">
      <h1>Proofreader</h1>
      <p class="subtitle">Search for dialogue lines and submit corrections</p>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Type the dialogue line you're looking for..."
          autocomplete="off"
        >
        <button id="search-btn" class="btn primary">Search</button>
      </div>
      <p class="search-hint">Enter at least 3 characters to search across all scenario files</p>
    </section>

    <!-- Results Section -->
    <section id="results-section" class="hidden">
      <h2>Search Results</h2>
      <div id="results-list"></div>
    </section>


    <!-- Correction Modal -->
    <div id="correction-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Submit Correction</h2>
        <div class="modal-body">
          <div class="field">
            <label>Original Text:</label>
            <div id="original-text" class="text-box readonly"></div>
          </div>
          <div class="field">
            <label>Corrected Text:</label>
            <textarea id="corrected-text" class="text-box editable" rows="4" placeholder="Use line breaks to control text flow"></textarea>
          </div>
          
          <!-- Game-style Preview -->
          <div class="field">
            <label>In-Game Preview:</label>
            <div class="game-preview">
              <div class="game-box">
                <div class="game-speaker" id="preview-speaker">Speaker</div>
                <div class="game-contents">
                  <div class="game-text" id="preview-text">
                    <div class="game-line"></div>
                    <div class="game-line"></div>
                    <div class="game-line"></div>
                  </div>
                </div>
              </div>
            </div>
            <p class="preview-hint" id="preview-hint">Max 3 lines per text box.</p>
          </div>
          
          <div class="field">
            <label>Your Name (for PR attribution):</label>
            <input type="text" id="submitter-name" placeholder="e.g., John D." maxlength="50">
          </div>
          <div class="field">
            <label>Description (optional):</label>
            <input type="text" id="correction-description" placeholder="Brief explanation of the fix...">
          </div>
        </div>
        <div class="modal-footer">
          <button id="cancel-correction" class="btn secondary">Cancel</button>
          <button id="submit-correction" class="btn primary">Submit Pull Request</button>
        </div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p id="loading-text">Loading...</p>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
