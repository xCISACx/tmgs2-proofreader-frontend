<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMGS2 Proofreader - Admin Portal</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>🔐 TMGS2 PR Management Portal</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="btn btn-secondary">↻ Refresh</button>
        <button id="closeSelectedBtn" class="btn btn-danger" disabled>Close Selected (0)</button>
        <button id="mergeSelectedBtn" class="btn btn-primary" disabled>Merge Selected (0)</button>
      </div>
    </header>

    <div class="stats-bar">
      <span id="prCount">Loading...</span>
      <span id="selectedCount">0 selected</span>
    </div>

    <div class="controls">
      <label class="select-all">
        <input type="checkbox" id="selectAllCheckbox"> Select All
      </label>
      <div class="filter-group">
        <input type="text" id="filterInput" placeholder="Filter by file path or description...">
      </div>
    </div>

    <div id="prList" class="pr-list">
      <div class="loading">Loading pull requests...</div>
    </div>

    <!-- Merge Confirmation Modal -->
    <div id="mergeModal" class="modal hidden">
      <div class="modal-content">
        <h2>Confirm Batch Merge</h2>
        <p id="mergeModalText">You are about to merge <span id="mergeCount">0</span> pull requests.</p>
        <div id="mergeProgress" class="merge-progress hidden">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div id="progressText">Merging...</div>
        </div>
        <div id="mergeResults" class="merge-results hidden"></div>
        <div class="modal-actions">
          <button id="cancelMergeBtn" class="btn btn-secondary">Cancel</button>
          <button id="confirmMergeBtn" class="btn btn-danger">Merge All</button>
        </div>
      </div>
    </div>

    <!-- Close Confirmation Modal -->
    <div id="closeModal" class="modal hidden">
      <div class="modal-content">
        <h2>Confirm Batch Close</h2>
        <p>You are about to close <span id="closeCount">0</span> pull requests without merging.</p>
        <div id="closeProgress" class="merge-progress hidden">
          <div class="progress-bar"><div class="progress-fill" id="closeProgressFill"></div></div>
          <div id="closeProgressText">Closing...</div>
        </div>
        <div id="closeResults" class="merge-results hidden"></div>
        <div class="modal-actions">
          <button id="cancelCloseBtn" class="btn btn-secondary">Cancel</button>
          <button id="confirmCloseBtn" class="btn btn-danger">Close All</button>
        </div>
      </div>
    </div>

    <!-- Diff Modal -->
    <div id="diffModal" class="modal hidden">
      <div class="modal-content modal-large">
        <div class="modal-header">
          <h2 id="diffModalTitle">PR Details</h2>
          <button class="close-btn" id="closeDiffModal">&times;</button>
        </div>
        <div id="diffContent" class="diff-content"></div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
